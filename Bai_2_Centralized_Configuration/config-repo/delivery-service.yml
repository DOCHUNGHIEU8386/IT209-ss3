# Cấu hình chuẩn cho delivery-service trong Centralized Config Repository
# Tên file quy ước: delivery-service.yml (ánh xạ với spring.application.name = delivery-service)

spring:
  datasource:
    url: jdbc:mysql://foodx-cluster.local:3306/delivery_db
    username: delivery_service_user
    # Mật khẩu đã được mã hóa an toàn theo chuẩn Spring Cloud Config Cipher
    password: '{cipher}AQCD981ZxqVbn710MlOpQrstU902VaBxYz0987654321qwertyuiop1234567890=='
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8087

# Cấu hình Actuator phục vụ giám sát và Dynamic Configuration Refresh
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
